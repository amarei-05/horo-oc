name: keep-supabase-awake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(grep -oE "supabaseUrl:[[:space:]]*'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/" | sed -E 's#/+$##')
          KEY=$(grep -oE "supabaseKey:[[:space:]]*'[^']+'" config.js | sed -E "s/.*'([^']+)'/\1/")
          if [ -z "$URL" ] || [ "$URL" = "CHANGE_ME" ]; then
            echo "config.js에 Supabase 주소가 아직 없어요."
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/characters?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase 응답: $CODE"
          test "$CODE" = "200"

      - name: Monthly heartbeat
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" -lt 6 ]; then
            date -u > .github/heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat
            git commit -m "heartbeat" && git push
          fi
